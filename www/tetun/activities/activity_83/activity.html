<!doctype html>
<html lang="en">
	<head>
		<title>Timor Home App</title>
		
		<meta charset="utf-8" />
		<meta http-equiv="x-ua-compatible" content="ie=edge" />
		<meta name="description" content="" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
		<link rel="shortcut icon" href="image/logo.jpg" />
		<link rel="apple-touch-icon" href="image/logo.jpg" />
		-->
		<link rel="stylesheet" type="text/css" href="../../css/jquery-ui.css" />
		<link rel="stylesheet" type="text/css" href="../../css/jqueryui-style.css" />
		<link rel="stylesheet" type="text/css" href="../../css/font_awesome.css" />
		<link rel="stylesheet" type="text/css" href="../../css/main.css" />
		
		<script src="../../js/jquery-3.6.0.js"></script>
		<script src="../../js/jquery-ui.js"></script>
		<script type="text/javascript" src="../../js/main.js"></script>
		<style>
			#divCompletionMsg {
        text-align: center;
        color: #2d6839;
        position: absolute;
        top: 130px;
        left: 50%; /* move to center horizontally */
        transform: translateX(-50%); /* perfectly center it */
      }
			#divCorrectTextPanel {
        transition: transform 0.3s ease;
        cursor: pointer;
      }
      .whiteTick {
        filter: brightness(10) invert(1);
      }
      .greenTick {
        /* green color */
        filter: brightness(1) invert(0);
      }
      .zoomTick {
        transform: scale(1.5);
      }
		</style>
	
		<script language="javascript">
			var rArrDivList = ["div_1", "div_2", "div_3"];
			var rListIndex = 0;
			
			var rImgHiLightBlinkInterval = 0;
			var rImgHiLightBlinkCount = 0;			
			
			function doNavigateAct(rAction) {
				
				document.getElementById("vidAni").pause();
				document.getElementById("vidAni").currentTime = 0;

				for (var i=0; i<rArrDivList.length; i++) {
					document.getElementById(rArrDivList[i]).style.display = "none";
				}
				if (rAction.toUpperCase()=="N") {
					rListIndex++;
				} else {
					rListIndex--;
				}
				
				if (rListIndex<=0) {
					rListIndex = 0;
				}

				if (rListIndex>=rArrDivList.length-1) {
					rListIndex = rArrDivList.length-1;
				}
				
				if (rListIndex<=0) {
					document.getElementById("divBtnReplay").style.display = "none";
					document.getElementById("divBtnBack").style.display = "none";
					document.getElementById("divBtnNext").style.display = "inline-block";		
          document.getElementById("divCompletionMsg").style.display = "none";		
				} else {
				if (rListIndex>=rArrDivList.length-1) {
					document.getElementById("divBtnReplay").style.display = "inline-block";
					document.getElementById("divBtnBack").style.display = "inline-block";
					document.getElementById("divBtnNext").style.display = "none";
          document.getElementById("divCompletionMsg").style.display = "block";	
				} else {
					document.getElementById("divBtnReplay").style.display = "inline-block";
					document.getElementById("divBtnBack").style.display = "inline-block";
					document.getElementById("divBtnNext").style.display = "inline-block";	
          document.getElementById("divCompletionMsg").style.display = "none";				
				} }
				
				document.getElementById(rArrDivList[rListIndex]).style.display = "block";
				
				if (rListIndex==1) {
					document.getElementById("vidAni").currentTime = 0;
					document.getElementById("vidAni").play();
				}
				
			}
			
			function doResetActivity() {

				document.getElementById("vidAni").pause();
				document.getElementById("vidAni").currentTime = 0;
				
				for (var i=0; i<rArrDivList.length; i++) {
					document.getElementById(rArrDivList[i]).style.display = "none";
				}
				
				rListIndex = 0;
				
				if (rListIndex<=0) {
					document.getElementById("divBtnReplay").style.display = "none";
					document.getElementById("divBtnBack").style.display = "none";
					document.getElementById("divBtnNext").style.display = "inline-block";			
				} else {
				if (rListIndex>=rArrDivList.length-1) {
					document.getElementById("divBtnReplay").style.display = "inline-block";
					document.getElementById("divBtnBack").style.display = "inline-block";
					document.getElementById("divBtnNext").style.display = "none";
				} else {
					document.getElementById("divBtnReplay").style.display = "inline-block";
					document.getElementById("divBtnBack").style.display = "inline-block";
					document.getElementById("divBtnNext").style.display = "inline-block";				
				} }
				
				document.getElementById(rArrDivList[rListIndex]).style.display = "block";
				if (rListIndex >= rArrDivList.length - 1) {
          document.getElementById("divCompletionMsg").style.display = "block";
        } else {
          document.getElementById("divCompletionMsg").style.display = "none";
        }
			}
		</script>
	</head>

	<body bgcolor="#000000">
		<div id="divWrapper" name="divWrapper" style="position:absolute; width:100%; height:100%; left:0px; top:0px; border:0px solid red;">
			<table width="100%" height="100%" cellspacing="0" cellpadding="0" border="0">
				<tr>
					<td width="100%" height="100%" align="center" valign="middle">
						<div id="divContainer" name="divContainer" style="position:relative; width:730px; height:310px; background-color:#ffffff; border:0px solid blue;">
							<div style="position:relative; width:100%; height:100%; left:0px; top:0px; background:transparent; border:0px solid green;">
								<div id="div_1" name="div_1" style="position:absolute; width:75; height:auto; left:100px; top:0px; border:0px solid #333333; display:none;">
                    				<div style="position: absolute; top:0px; left:0px;"><img width="auto" height="275" src="images/ani.png" /></div>
								</div>
								<div id="div_2" name="div_2" style="position:absolute; width:75%; height:auto; left:100px; top:0px; border:0px solid #333333; display:block;">
									<div id="divVidAni" name="divVidAni" style="position:absolute; left:0px; width:auto; height:275px; left:0px; top:0px; border:0px solid green; display:block;">
										<video id="vidAni" name="vidAni" autoplay playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="left:0px; width:auto; height:275px;" src="media/video/animation.mp4" onended="javascript:doEndVideo(this);">
									</div>
									</div>
								<div id="div_3" name="div_3" style="position:absolute; width:75%; height:auto; left:100px; top:0px; border:0px solid #333333; display:block;">
									<div id="divVidAni" name="divVidAni" style="position:absolute; left:0px; width:auto; height:275px; left:0px; top:0px; border:0px solid green; display:block;">
										<img width="auto" height="275" src="images/ani.png">
									</div><div id="divCompletionMsg">
                    <table
                      width="100%"
                      height="100%"
                      cellspacing="0"
                      cellpadding="0"
                      border="0"
                    >
                      <tr>
                        <td align="center" valign="top">
                          <div style="display: block">
                            <span
                              id="childText"
                              style="
                                font-size: 12px;
                                font-weight: bold;
                                margin-left: 10px;
                              "
                            >
                            </span>
                            <img
                              width="auto"
                              height="30"
                              src="../../images/tick.png"
                              onclick="enlargeTick()"
                              id="divCorrectTextPanel"
                              class="whiteTick"
                            />
                          </div>
                        </td>
                      </tr>
                    </table>
                  </div>	
								</div>
								
								<!--Buttons Begin-->								
								<div id="divBtnPanel" name="divBtnPanel" style="position:absolute; width:100%; height:auto; left:0px; bottom:0px; border:0px solid #333333; display:block;">
									<div id="divBtnBack" name="divBtnBack" style="position:relative; border:0px solid #666666; cursor:pointer; display:inline-block;" onclick="javascript:doNavigateAct('P');">
										<table width="100%" height="100%" cellspacing="0" cellpadding="0" border="0">
											<tr>
												<td align="center" valign="top">
													<div style="display:block;">
														<img class="clsMicroBack" src="../../images/back_arrow.png" />
													</div>
												</td>
											</tr>
										</table>									
									</div>
									<div style="position:relative; width:10px; display:inline-block;"></div>
									<div id="divBtnReplay" name="divBtnReplay" style="position:relative; border:0px solid #666666; cursor:pointer; display:inline-block;" onclick="javascript:doResetActivity();">
										<table width="100%" height="100%" cellspacing="0" cellpadding="0" border="0">
											<tr>
												<td align="center" valign="top">
													<div style="display:block;">
														<img class="clsMicroReplay" src="../../images/replay.png" />
													</div>
												</td>
											</tr>
										</table>									
									</div>
									<div style="position:relative; width:10px; display:inline-block;"></div>								
									<div id="divBtnNext" name="divBtnNext" style="position:relative; border:0px solid #666666; cursor:pointer; display:inline-block;" onclick="javascript:doNavigateAct('N');">
										<table width="100%" height="100%" cellspacing="0" cellpadding="0" border="0">
											<tr>
												<td align="center" valign="top">
													<div style="display:block;">
														<img class="clsMicroNext" src="../../images/next_arrow.png" />
													</div>
												</td>
											</tr>
										</table>									
									</div>									
								</div>							
							</div>
							
							<div id="divMacroBtnNavPanel" name="divMacroBtnNavPanel" style="position:absolute; width:65px; height:100%; right:0px; top:0px; border:0px solid red;">
								<div id="divPosterImage" name="divPosterImage" class="clsMacroPosterImage" style="cursor:pointer;">
									<img id="imgPoster" name="imgPoster" width="100%" height="100%" />
								</div>							
								<div id="divBtnBackArrow" name="divBtnBackArrow" class="clsMacroBack" style="cursor:pointer;" onclick="javascript:doRedirectToURL(this, 'P');">
									<img width="100%" height="100%" src="../../images/back_arrow.png" />
								</div>
								<div id="divBtnNextArrow" name="divBtnNextArrow" class="clsMacroNext" style="cursor:pointer;" onclick="javascript:doRedirectToURL(this, 'N');">
									<img width="100%" height="100%" src="../../images/next_arrow.png" />
								</div>					
								<div id="divBtnHome" name="divBtnHome" class="clsMacroHome" style="cursor:pointer;" onclick="javascript:doRedirectToURL(this, 'H');">
									<img width="100%" height="100%" src="../../images/home.png" />
								</div>
							</div>							
						</div>
					</td>
				</tr>
			</table>
		</div>

		<script language="javascript">
      const activeChildId = sessionStorage.getItem("active_child_name");

      const text = 'rona música (Hamoos sala aula)';

      document.getElementById("childText").innerText =
        (activeChildId ? activeChildId + " " : "") + text;
      doResetActivity();
      doResetMainNavButton();
      function enlargeTick() {
        const img = document.getElementById("divCorrectTextPanel");
        img.classList.toggle("zoomTick");
        img.classList.toggle("greenTick");
        img.classList.remove("whiteTick");
      }
    </script>
		<script src="../../activity-tracker.js"></script>
	</body>
</html>
